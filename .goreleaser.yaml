version: 2

project_name: chezmoi-sops

before:
  hooks:
    - go mod tidy

builds:
  - id: chezmoi-sops
    main: ./cmd/chezmoi-sops
    binary: chezmoi-sops
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Tag}} -X main.commit={{.Commit}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      # Windows on arm64 is not supported by Go's standard library, so
      # there is nothing to build.
      - goos: windows
        goarch: arm64
    # The targets are:
      #   linux/amd64   x86-64 Linux
      #   linux/arm64   arm64 Linux
      #   darwin/arm64  Apple silicon
      #   darwin/amd64  Intel Macs - the dotfiles repository still has one
      #   windows/amd64 x86-64 Windows

archives:
  - id: default
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - LICENSE
      - README.md
      - PLAN.md

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

release:
  draft: false
  prerelease: auto
